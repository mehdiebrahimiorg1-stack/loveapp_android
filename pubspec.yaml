name: loveapp_android
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  audioplayers: ^6.0.0
  image_picker: ^1.0.7
  permission_handler: ^11.3.1
  photo_manager: ^3.3.0
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  cupertino_icons: ^1.0.8
  
  flutter_launcher_icons: ^0.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/


flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"